# CI for CampusSpace AI (plan §17.2, spec §13).
# The branch ruleset requires the "backend" check by name, so do not rename that job.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Same SDK as local (8.0.423, pinned by global.json).
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore backend

      - run: dotnet build backend -c Release --no-restore -p:TreatWarningsAsErrors=true

      # Integration tests start postgres:16 via Testcontainers (Docker is available on ubuntu-latest).
      - run: >-
          dotnet test backend -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults

  agent:
    name: agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4

      # setup-uv publishes no floating major tag (v8+), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: agent-service/uv.lock

      - run: uv python install 3.11

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked

      - run: uv run ruff check .

      # Tests set their own env and fake keys: no secrets, no model calls.
      - run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Vitest + MSW: no real network, no .env.
      - run: npm test -- --run

      - run: npm run build

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Same Flutter as local (CLAUDE.md pins 3.47 stable). No APK build until Phase 6.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Fakes and provider overrides: no network, no emulator.
      - run: flutter test

      # Campus time is always +05:30: the request screens (and the status notices built from their data) must read the
      # same on a phone in another zone.
      - run: flutter test test/features/requests test/features/notifications
        env:
          TZ: America/New_York
