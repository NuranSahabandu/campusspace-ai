# Render Blueprint (Task 6.D3): the API and the agent service, both from Dockerfiles, on the free plan.
# Runbook: docs/deploy/RUNBOOK.md. Spec: https://render.com/docs/blueprint-spec
#
# Rules:
# - No secret value is ever written here. Secrets are either generated by Render (generateValue: random 256-bit,
#   base64, created once when the variable doesn't exist yet and kept on later syncs) or `sync: false`, which makes
#   Render ask for the value in the dashboard when the Blueprint is first created (later syncs ignore them).
# - singapore: the Render region closest to Sri Lanka (oregon, ohio, virginia, frankfurt, singapore). Neon's matching
#   region is AWS ap-southeast-1 (Singapore).
# - autoDeployTrigger checksPass: a push to main deploys only after its GitHub CI checks pass. buildFilter: a service
#   rebuilds only when its own folder (or this file) changed.
# - healthCheckPath /health/live: no database or outbound call, so Render's frequent checks never wake Neon or the
#   other service. /health (database + agent service / checkpointer) stays the evidence URL.

envVarGroups:
  # The two service-to-service keys, shared by both services under the SAME names (both read these exact variables).
  # Different random values (the API and the agent service both refuse to start if they are equal). Never the JWT key:
  # the agent service must not be able to sign user tokens.
  - name: campusspace-service-keys
    envVars:
      - key: AgentTools__Key # X-Agent-Key: agent service -> /internal/agent-tools
        generateValue: true
      - key: AgentService__ServiceKey # X-Service-Key: API -> agent service /workflows
        generateValue: true

services:
  - type: web
    name: campusspace-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/live
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - render.yaml
      ignoredPaths:
        - backend/CampusSpace.Tests/**
    envVars:
      - fromGroup: campusspace-service-keys
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Signs user tokens: the API only.
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: campusspace-api
      - key: Jwt__Audience
        value: campusspace-clients
      # The agent service's public URL. If Render gave the service a suffixed name, change it here AND in the dashboard.
      - key: AgentService__BaseUrl
        value: https://campusspace-agent.onrender.com
      # Neon DIRECT endpoint, role campusspace_app (DML only), Npgsql keyword form with SslMode=VerifyFull.
      - key: ConnectionStrings__Default
        sync: false
      # The demo accounts' password (16 hex characters; never the public Development one).
      - key: Seed__DemoPassword
        sync: false
      # The Vercel URL (https, no path). Startup refuses an empty list: first enter http://localhost:5173.
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Cors__AllowedOrigins__1
        value: http://localhost:5173
      # The private production bucket campusspace-photos and its own bucket-scoped token.
      - key: R2__AccountId
        sync: false
      - key: R2__AccessKeyId
        sync: false
      - key: R2__SecretAccessKey
        sync: false
      - key: R2__Bucket
        sync: false
      # Optional: without a Brevo key every email is recorded as Skipped.
      - key: Email__BrevoApiKey
        sync: false
      - key: Email__FromAddress
        sync: false
      # Required with a Brevo key: the seeded addresses are fake.
      - key: Email__RedirectAllTo
        sync: false

  - type: web
    name: campusspace-agent
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./agent-service/Dockerfile
    dockerContext: ./agent-service
    healthCheckPath: /health/live
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - agent-service/**
        - render.yaml
      ignoredPaths:
        - agent-service/tests/**
    envVars:
      - fromGroup: campusspace-service-keys
      # The API's public URL (for /internal/agent-tools). Change it if Render suffixed the API's name.
      - key: API_BASE_URL
        value: https://campusspace-api.onrender.com
      # All four agents on Gemini for the demo. Empty = every agent is a stub (no Gemini calls, no credit used).
      - key: AGENT_LLM_AGENTS
        value: supervisor,venue_matching,equipment_allocation,policy_cost
      # Gemini key (required while AGENT_LLM_AGENTS names any agent).
      - key: GOOGLE_API_KEY
        sync: false
      # Neon POOLED endpoint, role campusspace_agent, database campusspace_agent (its own checkpoints only).
      - key: AGENT_CHECKPOINT_URL
        sync: false
      # Never AGENT_ENV or AGENT_FAULT*: development only (the SQLite fallback and the failure drills).
